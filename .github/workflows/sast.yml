name: SAST
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Install SAST tools
        run: |
          pip install --no-cache-dir "semgrep==1.*"
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Semgrep (OWASP + auto)
        run: semgrep --config p/owasp-top-ten --config auto --error --sarif -o semgrep.sarif || true

      - name: Gosec (Go SAST)
        run: gosec -fmt sarif -out gosec.sarif ./... || true

      - name: Staticcheck (Go static analysis)
        run: |
          staticcheck -f sarif ./... > staticcheck.sarif || true
          # Ensure SARIF file has valid structure - add results array if missing and fix line/column numbers
          if [ -f staticcheck.sarif ]; then
            python3 << 'PYTHON_SCRIPT'
          import json
          import sys
          try:
              with open("staticcheck.sarif", "r") as f:
                  data = json.load(f)
              if "runs" in data:
                  for run in data["runs"]:
                      if "results" not in run:
                          run["results"] = []
                      # Fix invalid startLine and startColumn values (must be >= 1)
                      # and ensure artifactLocation is present
                      for result in run.get("results", []):
                          for location in result.get("locations", []):
                              physical_location = location.get("physicalLocation", {})
                              # Ensure artifactLocation exists and has a uri
                              if "artifactLocation" not in physical_location:
                                  physical_location["artifactLocation"] = {"uri": "unknown"}
                                  location["physicalLocation"] = physical_location
                              elif "uri" not in physical_location.get("artifactLocation", {}):
                                  physical_location["artifactLocation"]["uri"] = "unknown"
                              
                              region = physical_location.get("region", {})
                              if "startLine" in region and region["startLine"] < 1:
                                  region["startLine"] = 1
                              if "startColumn" in region and region["startColumn"] < 1:
                                  region["startColumn"] = 1
                              if "endLine" in region and region["endLine"] < 1:
                                  region["endLine"] = 1
                              if "endColumn" in region and region["endColumn"] < 1:
                                  region["endColumn"] = 1
              with open("staticcheck.sarif", "w") as f:
                  json.dump(data, f, indent=2)
              print("SARIF file validated/fixed successfully")
          except Exception as e:
              print(f"Error fixing SARIF: {e}")
              sys.exit(1)
          PYTHON_SCRIPT
          fi

      - name: List SARIF
        run: ls -lah *.sarif && head -n 20 gosec.sarif || true

      # Upload Semgrep first (sanity)
      - name: Upload SARIF (Semgrep)
        if: ${{ github.actor != 'nektos/act' && hashFiles('semgrep.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          wait-for-processing: true

      - name: Upload SARIF (Gosec)
        if: ${{ github.actor != 'nektos/act' && hashFiles('gosec.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          wait-for-processing: true

      - name: Upload SARIF (Staticcheck)
        if: ${{ github.actor != 'nektos/act' && hashFiles('staticcheck.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: staticcheck.sarif
          wait-for-processing: true

      - name: Save SARIF locally (act)
        if: ${{ github.actor == 'nektos/act' }}
        uses: actions/upload-artifact@v5
        with:
          name: sast-sarif
          path: |
            semgrep.sarif
            gosec.sarif
            staticcheck.sarif